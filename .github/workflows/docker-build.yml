name: Docker Build Test

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t kitchen-app .

      - name: Run tests inside container
        run: |
          docker run --rm kitchen-app pytest -q

      - name: Validate app runtime
        run: |
          docker run --rm kitchen-app python main.py test