name: Docker Build Test

on:
  push:
    branches: [ "main"]
    tags:
      - "v*"
  pull_request:
    branches: [ "main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/kitchen-app:${env.VERSION} \
            .

      - name: Run tests inside container
        run: |
          docker run --rm \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/kitchen-app:${env.VERSION} \
            pytest -q

      - name: Validate app runtime
        run: |
          docker run --rm \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/kitchen-app:${env.VERSION} \
            python main.py test

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/kitchen-app:${env.VERSION}

          if [[ "${VERSION}" != "latest" ]]; then
            docker tag ghcr.io/${{ github.repository_owner }}/kitchen-app:${env.VERSION} \
                       ghcr.io/${{ github.repository_owner }}/kitchen-app:latest
            docker push ghcr.io/${{ github.repository_owner }}/kitchen-app:latest
          fi