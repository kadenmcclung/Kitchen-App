name: Docker Build Test

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/kitchen-app:latest .

      - name: Run tests inside container
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/kitchen-app:latest pytest -q

      - name: Validate app runtime
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/kitchen-app:latest python main.py test

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/kitchen-app:latest