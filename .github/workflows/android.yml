name: Build Android APK

on:
  push:
    tags:
      - "apk-*"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            autoconf \
            automake \
            autoconf-archive \
            gettext \
            gperf \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libtinfo6

      - name: Upgrade pip
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install Buildozer + stable toolchain
        run: |
          pip install buildozer==1.5.0
          pip install cython==0.29.36
          pip install python-for-android==2024.1.21

      - name: Clean caches
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

