name: Build Android APK

on:
  push:
    tags:
      - "apk-*"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            autoconf \
            automake \
            autoconf-archive \
            gettext \
            gperf \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Fix autotools
        run: |
          libtoolize --force --copy

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

      - name: Install Android SDK cmdline-tools
        run: |
          mkdir -p $HOME/android-sdk
          export ANDROIDSDK=$HOME/android-sdk

          cd /tmp
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip

          mkdir -p $ANDROIDSDK/cmdline-tools/latest
          mv cmdline-tools/* $ANDROIDSDK/cmdline-tools/latest/

          echo "ANDROIDSDK=$ANDROIDSDK" >> $GITHUB_ENV
          echo "$ANDROIDSDK/cmdline-tools/latest/bin" >> $GITHUB_PATH   

      - name: Install Android Build Tools + platform-tools
        run: |
          sdkmanager "platform-tools" \
          "platforms;android-33" \
          "build-tools;34.0.0"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

